<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fly</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #121B17;
    --sidebar: #0F1713;
    --surface: #1C2822;
    --surface-2: #23332B;
    --border: #2E4038;
    --text: #ECEEE9;
    --muted: #93A79B;
    --accent: #7FB69A;
    --accent-strong: #4F8F72;
    --accent-soft: rgba(127,182,154,0.14);
    --accent-ink: #0E1512;
    --user-bubble: #1F2C25;
    --danger: #D08477;
    --shadow: rgba(0,0,0,0.35);
  }
  html[data-theme="light"]{
    --bg: #F6F5F0;
    --sidebar: #EFEEE7;
    --surface: #FFFFFF;
    --surface-2: #EEEFE8;
    --border: #DCE0D6;
    --text: #1B231E;
    --muted: #5E6D63;
    --accent: #3F7F62;
    --accent-strong: #2E6A50;
    --accent-soft: rgba(63,127,98,0.10);
    --accent-ink: #FFFFFF;
    --user-bubble: #E8F1EB;
    --danger: #B0463A;
    --shadow: rgba(20,30,25,0.10);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', system-ui, sans-serif;
    overflow:hidden;
    transition: background .2s ease, color .2s ease;
  }

  #app{ display:flex; height:100vh; width:100vw; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width: 272px; min-width:272px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display:flex; flex-direction:column;
    padding: 16px 12px;
    transition: margin-left .22s ease;
  }
  #sidebar.collapsed{ margin-left:-272px; }

  .brand{ display:flex; align-items:center; gap:9px; padding: 4px 8px 16px 8px; }
  .brand span{ font-family:'Newsreader', serif; font-style:italic; font-weight:500; font-size:21px; }

  #search-wrap{ position:relative; margin-bottom:12px; }
  #search-input{
    width:100%; background: var(--surface); border:1px solid var(--border);
    color: var(--text); font-family:'Inter'; font-size:13px;
    padding: 8px 10px 8px 30px; border-radius:8px; outline:none;
  }
  #search-input:focus{ border-color: var(--accent-strong); }
  #search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--muted); }

  .side-btn{
    display:flex; align-items:center; gap:8px; width:100%;
    background: var(--surface); border:1px solid var(--border);
    color: var(--text); font-family:'Inter'; font-size:13.5px;
    padding:9px 11px; border-radius:8px; cursor:pointer; margin-bottom:8px;
    transition: background .15s ease, border-color .15s ease;
  }
  .side-btn:hover{ background: var(--surface-2); border-color: var(--accent-strong); }
  .side-btn.primary{ background: var(--accent-soft); border-color: var(--accent-strong); color: var(--accent); font-weight:600; }

  #history-label{ font-size:11px; color: var(--muted); padding: 10px 8px 6px 8px; }
  #history-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }

  .history-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 8px 8px 10px; border-radius:7px; font-size:13px; color: var(--muted);
    cursor:pointer; border:1px solid transparent; position:relative;
  }
  .history-item .title{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-item:hover{ background: var(--surface); color: var(--text); }
  .history-item.active{ background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .history-item .pin-mark{ color: var(--accent); flex-shrink:0; }
  .history-item .menu-btn{
    opacity:0; background:none; border:none; color:var(--muted); cursor:pointer; padding:2px 4px; border-radius:4px;
  }
  .history-item:hover .menu-btn{ opacity:1; }
  .history-item .menu-btn:hover{ background: var(--surface-2); }

  .sidebar-divider{ border-top:1px solid var(--border); margin:10px 0; }
  .sidebar-footer{ display:flex; flex-direction:column; gap:6px; padding-top:6px; }
  .footer-row{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--muted); }
  .theme-toggle{
    display:flex; background: var(--surface); border:1px solid var(--border); border-radius:20px; padding:2px; cursor:pointer;
  }
  .theme-toggle span{ padding:3px 9px; border-radius:16px; font-size:11px; }
  .theme-toggle span.on{ background: var(--accent-soft); color: var(--accent); }

  /* ---------- Main ---------- */
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }

  #topbar{ display:flex; align-items:center; gap:12px; padding:13px 20px; border-bottom:1px solid var(--border); }
  #toggle-sidebar{ background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; border-radius:6px; }
  #toggle-sidebar:hover{ background: var(--surface); color: var(--text); }
  #conv-title{ font-size:13.5px; color: var(--text); font-weight:500; }
  #mode-badge{
    margin-left:auto; font-size:11.5px; color: var(--accent); background: var(--accent-soft);
    border:1px solid var(--accent-strong); padding:4px 10px; border-radius:20px;
  }

  #thread{ flex:1; overflow-y:auto; padding: 26px 0 10px 0; }
  #thread-inner{ max-width:760px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:24px; min-height:100%; }

  #empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:22px; padding: 0 20px;
  }
  #empty-state h1{ font-family:'Newsreader', serif; font-weight:500; font-style:italic; font-size:30px; margin:0; }
  #empty-state p{ color: var(--muted); font-size:14px; margin:0; max-width:420px; }

  .mode-grid{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:560px; }
  .mode-chip-lg{
    display:flex; align-items:center; gap:6px; background: var(--surface); border:1px solid var(--border);
    padding:8px 13px; border-radius:9px; font-size:12.5px; color: var(--muted); cursor:pointer;
  }
  .mode-chip-lg:hover{ border-color: var(--accent-strong); color: var(--text); }

  .msg-row{ display:flex; gap:11px; align-items:flex-start; }
  .msg-row.user{ flex-direction:row-reverse; }

  .avatar{ width:25px; height:25px; border-radius:50%; flex-shrink:0; margin-top:2px; }
  .avatar.fly{ background: conic-gradient(from 200deg, var(--accent), var(--accent-strong), var(--accent)); }
  .avatar.user{ background: var(--surface-2); border:1px solid var(--border); }

  .bubble-col{ display:flex; flex-direction:column; gap:6px; max-width:78%; }
  .msg-row.user .bubble-col{ align-items:flex-end; }

  .attachment-chip{
    display:flex; align-items:center; gap:7px; background: var(--surface-2); border:1px solid var(--border);
    padding:6px 10px; border-radius:8px; font-size:12px; color: var(--muted);
  }
  .attachment-chip img{ width:28px; height:28px; object-fit:cover; border-radius:4px; }

  .bubble{ padding: 10px 14px; border-radius:12px; font-size:14.5px; line-height:1.65; }
  .msg-row.fly .bubble{ background:transparent; padding-left:0; }
  .msg-row.user .bubble{ background: var(--user-bubble); border:1px solid var(--border); }
  .bubble p{ margin:0 0 10px 0; } .bubble p:last-child{ margin-bottom:0; }
  .bubble code{ background: var(--surface-2); padding:1px 5px; border-radius:4px; font-size:13px; font-family: ui-monospace, monospace; }
  .bubble pre{ background: var(--surface-2); border:1px solid var(--border); padding:12px; border-radius:8px; overflow-x:auto; font-size:13px; }
  .bubble pre code{ background:none; padding:0; }

  .sources-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .msg-actions{ display:flex; gap:4px; margin-top:2px; }
  .msg-actions button{
    background:none; border:none; color: var(--muted); cursor:pointer; font-size:11.5px;
    padding:3px 7px; border-radius:6px; display:flex; align-items:center; gap:4px;
  }
  .msg-actions button:hover{ background: var(--surface-2); color: var(--text); }
  .code-block{ position:relative; }
  .code-block .copy-btn{
    position:absolute; top:6px; right:6px; background: var(--surface); border:1px solid var(--border);
    color: var(--muted); font-size:11px; padding:3px 8px; border-radius:6px; cursor:pointer;
  }
  .code-block .copy-btn:hover{ color: var(--text); border-color: var(--accent-strong); }
  .source-pill{
    font-size:11px; color: var(--accent); background: var(--accent-soft); border:1px solid var(--accent-strong);
    padding:3px 9px; border-radius:20px; text-decoration:none; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .thinking{ display:flex; align-items:center; gap:8px; color: var(--muted); font-size:13px; padding:4px 0; }
  .thinking .dot{ width:5px; height:5px; border-radius:50%; background: var(--accent); opacity:.35; animation: pulse 1.1s infinite ease-in-out; }
  .thinking .dot:nth-child(2){ animation-delay:.15s; } .thinking .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{ 0%,100%{ opacity:.25; transform:scale(.85);} 50%{ opacity:1; transform:scale(1);} }

  .error-bubble{ color: var(--danger); font-size:13.5px; border:1px solid var(--danger); background: rgba(208,132,119,0.08); padding:10px 13px; border-radius:9px; }

  /* ---------- Composer ---------- */
  #composer-wrap{ padding: 12px 24px 18px 24px; }
  #pending-attachment{ max-width:760px; margin: 0 auto 8px auto; display:none; }
  #mode-row{ max-width:760px; margin:0 auto 8px auto; display:flex; gap:6px; flex-wrap:wrap; }
  .mode-chip{
    font-size:11.5px; padding:5px 11px; border-radius:20px; border:1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor:pointer;
  }
  .mode-chip.active{ background: var(--accent-soft); border-color: var(--accent-strong); color: var(--accent); font-weight:600; }

  #composer{
    max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
    background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:8px 8px 8px 6px;
    box-shadow: 0 6px 22px var(--shadow);
  }
  #composer:focus-within{ border-color: var(--accent-strong); }
  #attach-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; width:34px; height:34px;
    border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #attach-btn:hover{ background: var(--surface-2); color: var(--text); }
  #image-mode-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; width:34px; height:34px;
    border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #image-mode-btn:hover{ background: var(--surface-2); color: var(--text); }
  #image-mode-btn.active{ background: var(--accent-soft); color: var(--accent); border:1px solid var(--accent-strong); }
  #mic-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; width:34px; height:34px;
    border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #mic-btn:hover{ background: var(--surface-2); color: var(--text); }
  #mic-btn.recording{ color: var(--danger); animation: pulse 1s infinite ease-in-out; }

  .generated-image{ max-width: 100%; border-radius:12px; border:1px solid var(--border); display:block; }
  .image-caption{ font-size:12px; color: var(--muted); margin-top:6px; max-width:78%; }
  #msg-input{
    flex:1; background:none; border:none; outline:none; resize:none; color: var(--text);
    font-family:'Inter'; font-size:14.5px; line-height:1.5; max-height:160px; padding:8px 0;
  }
  #msg-input::placeholder{ color: var(--muted); }
  #send-btn{
    background: var(--accent); border:none; width:34px; height:34px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition: opacity .15s ease;
  }
  #send-btn:disabled{ opacity:.35; cursor:default; }
  #send-btn:not(:disabled):hover{ opacity:.88; }
  #foot-note{ text-align:center; font-size:11px; color: var(--muted); margin-top:9px; }

  /* ---------- Memory modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(0,0,0,0.5); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    width: 460px; max-width:90vw; max-height:78vh; background: var(--surface); border:1px solid var(--border);
    border-radius:14px; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); }
  .modal-head h2{ font-family:'Newsreader', serif; font-style:italic; font-weight:500; font-size:19px; margin:0; }
  .modal-close{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; }
  .modal-body{ padding:16px 18px; overflow-y:auto; flex:1; }
  .modal-body p.hint{ color: var(--muted); font-size:12.5px; margin:0 0 14px 0; }
  #memory-toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background: var(--surface-2); border-radius:9px; margin-bottom:14px; }
  #memory-toggle-row span{ font-size:13px; }
  .switch{ position:relative; width:38px; height:21px; background: var(--border); border-radius:20px; cursor:pointer; flex-shrink:0; }
  .switch.on{ background: var(--accent-strong); }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition: left .15s ease; }
  .switch.on::after{ left:19px; }
  #memory-add{ display:flex; gap:6px; margin-bottom:12px; }
  #memory-add input{ flex:1; background: var(--surface-2); border:1px solid var(--border); border-radius:7px; padding:8px 10px; color:var(--text); font-size:13px; outline:none; }
  #memory-add button{ background: var(--accent); border:none; color: var(--accent-ink); border-radius:7px; padding:0 13px; cursor:pointer; font-size:13px; font-weight:600; }
  .memory-item{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .memory-item:last-child{ border-bottom:none; }
  .memory-item button{ background:none; border:none; color:var(--muted); cursor:pointer; flex-shrink:0; }
  .memory-item button:hover{ color: var(--danger); }
  #memory-empty{ color: var(--muted); font-size:13px; text-align:center; padding:20px 0; }

  ::-webkit-scrollbar{ width:8px; } ::-webkit-scrollbar-thumb{ background: var(--surface-2); border-radius:6px; } ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 760px){
    #sidebar{ position:fixed; z-index:10; height:100vh; margin-left:-272px; }
    #sidebar.open{ margin-left:0; }
    .bubble-col{ max-width:90%; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div class="brand">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M10 1 L11.6 8.4 L19 10 L11.6 11.6 L10 19 L8.4 11.6 L1 10 L8.4 8.4 Z" fill="#7FB69A"/></svg>
      <span>Fly</span>
    </div>

    <div id="search-wrap">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="4.5"/><line x1="9.3" y1="9.3" x2="13" y2="13"/></svg>
      <input id="search-input" placeholder="Buscar conversaciones">
    </div>

    <button class="side-btn primary" id="new-chat-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="7" y1="1.5" x2="7" y2="12.5"/><line x1="1.5" y1="7" x2="12.5" y2="7"/></svg>
      Nueva conversación
    </button>
    <button class="side-btn" id="memory-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 1v3M7 10v3M1 7h3M10 7h3M3 3l2 2M9 9l2 2M11 3l-2 2M5 9l-2 2"/></svg>
      Memoria
    </button>

    <div id="history-label">Conversaciones</div>
    <div id="history-list"></div>

    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
      <div class="footer-row">
        <span>Tema</span>
        <div class="theme-toggle" id="theme-toggle">
          <span id="theme-dark">Oscuro</span><span id="theme-light">Claro</span>
        </div>
      </div>
      <div class="footer-row"><span>Fly · Google Gemini (gratis)</span></div>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <button id="toggle-sidebar" title="Mostrar/ocultar panel">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="14" height="12" rx="2"/><line x1="7" y1="3" x2="7" y2="15"/></svg>
      </button>
      <div id="conv-title">Nueva conversación</div>
      <div id="mode-badge">General</div>
    </div>

    <div id="thread"><div id="thread-inner"></div></div>

    <div id="composer-wrap">
      <div id="pending-attachment"></div>
      <div id="mode-row"></div>
      <div id="composer">
        <button id="attach-btn" title="Adjuntar archivo">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 3.5L4.8 9.7a2.5 2.5 0 003.5 3.5l6-6a4 4 0 00-5.6-5.6l-6 6a5.5 5.5 0 007.8 7.8"/></svg>
        </button>
        <button id="image-mode-btn" title="Generar una imagen">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="13" height="12" rx="2"/><circle cx="6" cy="6.5" r="1.3" fill="currentColor" stroke="none"/><path d="M3 12.5l4-4 2.5 2.5L13 7.5l1.5 1.5"/></svg>
        </button>
        <input type="file" id="file-input" style="display:none" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.md,.csv,.json,.js,.py,.html,.css">
        <textarea id="msg-input" rows="1" placeholder="Escribe un mensaje a Fly"></textarea>
        <button id="mic-btn" title="Dictar por voz">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 8a5 5 0 0010 0M8 13v2"/></svg>
        </button>
        <button id="send-btn" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L14 8M14 8L9 3M14 8L9 13" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="foot-note">Fly puede cometer errores. Verifica la información importante.</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="memory-modal">
  <div class="modal">
    <div class="modal-head"><h2>Memoria</h2><button class="modal-close" id="memory-close">&times;</button></div>
    <div class="modal-body">
      <p class="hint">Fly usa estas notas como contexto en tus conversaciones. Tú decides qué guarda.</p>
      <div id="memory-toggle-row">
        <span>Memoria activada</span>
        <div class="switch" id="memory-switch"></div>
      </div>
      <div id="memory-add">
        <input id="memory-input" placeholder="Añadir un recuerdo, ej. 'Prefiero respuestas breves'">
        <button id="memory-add-btn">Añadir</button>
      </div>
      <div id="memory-list"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const SEND_ICON_COLOR = () => getComputedStyle(document.documentElement).getPropertyValue('--accent-ink').trim();

  window.__flyCopyCode = function(btn){
    const code = btn.nextElementSibling.innerText;
    navigator.clipboard.writeText(code).then(() => {
      const old = btn.textContent; btn.textContent = 'Copiado';
      setTimeout(() => { btn.textContent = old; }, 1400);
    });
  };

  const MODES = [
    { id:'general', label:'General', system:'Responde de forma clara, directa y bien estructurada.' },
    { id:'research', label:'Investigación', system:'Investiga en internet antes de responder. Prioriza fuentes oficiales, académicas o institucionales, contrasta al menos dos fuentes cuando el tema lo amerite, y señala si hay información contradictoria.', tools:true },
    { id:'code', label:'Código', system:'Actúa como ingeniero de software senior. Da código correcto y bien comentado cuando aplique, explica decisiones clave con brevedad y señala riesgos o casos límite.' },
    { id:'writing', label:'Escritura', system:'Actúa como editor experto. Cuida claridad, tono y estructura. Si el usuario pide un texto, entrega el texto directamente; si pide revisión, sé específico sobre qué cambiar y por qué.' },
    { id:'study', label:'Estudio', system:'Actúa como tutor. Explica conceptos paso a paso, comprueba la comprensión con preguntas breves cuando ayude, y adapta el nivel de detalle a lo que el usuario ya sabe.' },
    { id:'data', label:'Datos', system:'Actúa como analista de datos. Estructura hallazgos en tablas o listas cuando ayude a la claridad, y sé explícito sobre supuestos y limitaciones del análisis.' },
  ];

  let conversations = [];
  let currentId = null;
  let currentMode = 'general';
  let pendingFile = null; // {name, mediaType, base64OrText, kind}
  let memoryNotes = [];
  let memoryEnabled = true;
  let imageMode = false;

  const historyList = document.getElementById('history-list');
  const threadInner = document.getElementById('thread-inner');
  const thread = document.getElementById('thread');
  const input = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const convTitleEl = document.getElementById('conv-title');
  const modeBadge = document.getElementById('mode-badge');
  const sidebar = document.getElementById('sidebar');
  const modeRow = document.getElementById('mode-row');
  const pendingAttachmentEl = document.getElementById('pending-attachment');
  const fileInput = document.getElementById('file-input');
  const searchInput = document.getElementById('search-input');

  // ---------- backend API helpers ----------
  // APP_TOKEN: si tu servidor define APP_PASSWORD, pega aquí ese mismo valor
  // (o mejor, pide que se ingrese una vez y guárdalo en localStorage de tu propio dominio).
  const APP_TOKEN = localStorage.getItem('fly_token') || '';

  async function api(path, options = {}){
    const res = await fetch('/api' + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(APP_TOKEN ? { Authorization: 'Bearer ' + APP_TOKEN } : {}),
        ...(options.headers || {}),
      },
    });
    if (res.status === 401){
      const t = window.prompt('Esta instancia de Fly está protegida. Ingresa la contraseña de acceso:');
      if (t){ localStorage.setItem('fly_token', t); location.reload(); }
      throw new Error('No autorizado');
    }
    if (!res.ok) throw new Error('Error de red: ' + res.status);
    return res.json();
  }

  async function streamChat(body, onDelta){
    const res = await fetch('/api/chat/stream', {
      method:'POST',
      headers: {
        'Content-Type':'application/json',
        ...(APP_TOKEN ? { Authorization:'Bearer ' + APP_TOKEN } : {}),
      },
      body: JSON.stringify(body),
    });
    if (res.status === 401){
      const t = window.prompt('Esta instancia de Fly está protegida. Ingresa la contraseña de acceso:');
      if (t){ localStorage.setItem('fly_token', t); location.reload(); }
      throw new Error('No autorizado');
    }
    if (!res.ok || !res.body){
      let msg = 'Error de red: ' + res.status;
      try{ const j = await res.json(); if (j.error) msg = j.error; }catch(e){}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    const MARKER = '\n\n<<<SOURCES>>>';
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      full += decoder.decode(value, { stream:true });
      const markerIdx = full.indexOf(MARKER);
      onDelta(markerIdx === -1 ? full : full.slice(0, markerIdx));
    }
    const markerIdx = full.indexOf(MARKER);
    let text = full, sources = [];
    if (markerIdx !== -1){
      text = full.slice(0, markerIdx);
      try{ sources = JSON.parse(full.slice(markerIdx + MARKER.length)); }catch(e){ sources = []; }
    }
    return { text: text.trim(), sources };
  }

  // ---------- theme ----------
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-dark').classList.toggle('on', theme==='dark');
    document.getElementById('theme-light').classList.toggle('on', theme==='light');
  }
  document.getElementById('theme-toggle').addEventListener('click', async () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    api('/settings', { method:'PUT', body: JSON.stringify({ theme: next }) }).catch(console.error);
  });

  // ---------- mode chips ----------
  function renderModeRow(){
    modeRow.innerHTML = '';
    MODES.forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'mode-chip' + (m.id === currentMode ? ' active' : '');
      chip.textContent = m.label;
      chip.addEventListener('click', () => {
        currentMode = m.id;
        modeBadge.textContent = m.label;
        renderModeRow();
      });
      modeRow.appendChild(chip);
    });
  }

  // ---------- conversations ----------
  function newConversationObj(){
    return { id:'c'+Date.now()+Math.random().toString(36).slice(2,7), title:null, pinned:false, messages:[], updatedAt: Date.now() };
  }

  async function createConversation(){
    try{
      const created = await api('/conversations', { method:'POST', body: JSON.stringify({ title:null, messages:[] }) });
      conversations.unshift({ ...created, pinned:false, messages:[], updatedAt: created.updated_at });
      currentId = created.id;
    }catch(e){
      // sin conexión al backend: sigue funcionando localmente en esta pestaña
      const conv = newConversationObj();
      conversations.unshift(conv);
      currentId = conv.id;
    }
    renderHistory();
    renderThread();
  }

  function getCurrent(){ return conversations.find(c => c.id === currentId); }

  function persistConversations(conv){
    conv = conv || getCurrent();
    if (!conv) return;
    api(`/conversations/${conv.id}`, {
      method:'PUT',
      body: JSON.stringify({ title: conv.title, pinned: conv.pinned, messages: conv.messages }),
    }).catch(err => console.error('No se pudo guardar la conversación:', err));
  }

  function renderHistory(){
    const query = searchInput.value.trim().toLowerCase();
    historyList.innerHTML = '';
    const sorted = [...conversations].sort((a,b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
    sorted
      .filter(c => !query || (c.title || '').toLowerCase().includes(query))
      .forEach(c => {
        const el = document.createElement('div');
        el.className = 'history-item' + (c.id === currentId ? ' active' : '');
        el.innerHTML = `
          ${c.pinned ? '<svg class="pin-mark" width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><circle cx="5.5" cy="5.5" r="4"/></svg>' : ''}
          <span class="title">${(c.title || 'Nueva conversación')}</span>
          <button class="menu-btn" data-id="${c.id}">⋯</button>
        `;
        el.querySelector('.title').addEventListener('click', () => {
          currentId = c.id; renderHistory(); renderThread();
        });
        el.querySelector('.menu-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          handleHistoryMenu(c);
        });
        historyList.appendChild(el);
      });
  }

  function handleHistoryMenu(conv){
    const action = window.prompt('Escribe: "fijar", "renombrar" o "eliminar"', conv.pinned ? 'fijar' : '');
    if (!action) return;
    const a = action.trim().toLowerCase();
    if (a === 'fijar'){ conv.pinned = !conv.pinned; }
    else if (a === 'renombrar'){
      const t = window.prompt('Nuevo nombre:', conv.title || '');
      if (t) conv.title = t.slice(0,60);
    } else if (a === 'eliminar'){
      if (window.confirm('¿Eliminar esta conversación?')){
        api(`/conversations/${conv.id}`, { method:'DELETE' }).catch(console.error);
        conversations = conversations.filter(c => c.id !== conv.id);
        if (currentId === conv.id){
          currentId = conversations[0] ? conversations[0].id : null;
          if (!currentId){ createConversation(); return; }
        }
        renderHistory(); renderThread();
        return;
      } else { return; }
    }
    persistConversations(conv);
    renderHistory();
    renderThread();
  }

  searchInput.addEventListener('input', renderHistory);

  // ---------- rendering messages ----------
  function escapeHtml(str){ return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function formatContent(text){
    let safe = escapeHtml(text);
    safe = safe.replace(/```([\s\S]*?)```/g, (m, code) => '<div class="code-block"><button class="copy-btn" onclick="window.__flyCopyCode(this)">Copiar</button><pre><code>' + code.trim() + '</code></pre></div>');
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    const paragraphs = safe.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g,'<br>') + '</p>');
    return paragraphs.join('');
  }

  function renderThread(){
    const conv = getCurrent();
    threadInner.innerHTML = '';
    convTitleEl.textContent = conv && conv.title ? conv.title : 'Nueva conversación';

    if (!conv || conv.messages.length === 0){
      const grid = MODES.map(m => `<div class="mode-chip-lg" data-mode="${m.id}">${m.label}</div>`).join('');
      threadInner.innerHTML = `
        <div id="empty-state">
          <h1>¿En qué estás pensando?</h1>
          <p>Escribe abajo, adjunta un archivo o elige un modo para empezar.</p>
          <div class="mode-grid">${grid}</div>
        </div>`;
      threadInner.querySelectorAll('.mode-chip-lg').forEach(el => {
        el.addEventListener('click', () => {
          currentMode = el.dataset.mode;
          modeBadge.textContent = MODES.find(m => m.id === currentMode).label;
          renderModeRow();
          input.focus();
        });
      });
      return;
    }

    conv.messages.forEach((m, idx) => {
      const row = document.createElement('div');
      row.className = 'msg-row ' + m.role;
      const avatar = document.createElement('div');
      avatar.className = 'avatar ' + (m.role === 'user' ? 'user' : 'fly');
      const col = document.createElement('div');
      col.className = 'bubble-col';

      if (m.attachment){
        const chip = document.createElement('div');
        chip.className = 'attachment-chip';
        chip.innerHTML = (m.attachment.kind === 'image')
          ? `<img src="data:${m.attachment.mediaType};base64,${m.attachment.data}"><span>${m.attachment.name}</span>`
          : `<span>📎 ${m.attachment.name}</span>`;
        col.appendChild(chip);
      }

      if (m.pending){
        const b = document.createElement('div');
        b.className = 'bubble';
        b.id = 'pending-bubble';
        b.innerHTML = `<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>${m.statusText || 'Pensando…'}</span></div>`;
        col.appendChild(b);
      } else if (m.error){
        const b = document.createElement('div');
        b.className = 'error-bubble';
        b.textContent = m.content;
        col.appendChild(b);
      } else if (m.image){
        const img = document.createElement('img');
        img.className = 'generated-image';
        img.src = `data:${m.image.mimeType};base64,${m.image.data}`;
        col.appendChild(img);
        const cap = document.createElement('div');
        cap.className = 'image-caption';
        cap.textContent = `${m.image.width}×${m.image.height}`;
        col.appendChild(cap);

        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        actions.innerHTML = `
          <button data-act="dl">Descargar</button>
          <button data-act="upscale">Subir calidad</button>
          <button data-act="regen-img">Otra variante</button>`;
        actions.querySelector('[data-act="dl"]').addEventListener('click', () => downloadImage(m.image.data, m.image.mimeType, 'fly-imagen.jpg'));
        actions.querySelector('[data-act="upscale"]').addEventListener('click', () => {
          const nextW = Math.min((m.image.width || 1024) * 2, 2048);
          const nextH = Math.min((m.image.height || 1024) * 2, 2048);
          generateImage(conv, m.image.originalPrompt, { isRegen:true, upscale:true, width:nextW, height:nextH, seed:m.image.seed });
        });
        actions.querySelector('[data-act="regen-img"]').addEventListener('click', () => {
          generateImage(conv, m.image.originalPrompt, { isRegen:true, width:m.image.width, height:m.image.height });
        });
        col.appendChild(actions);
      } else {
        const b = document.createElement('div');
        b.className = 'bubble';
        b.innerHTML = formatContent(m.content);
        col.appendChild(b);
        if (m.sources && m.sources.length){
          const sr = document.createElement('div');
          sr.className = 'sources-row';
          m.sources.slice(0,5).forEach(s => {
            const a = document.createElement('a');
            a.className = 'source-pill'; a.href = s.url; a.target = '_blank'; a.textContent = s.title || s.url;
            sr.appendChild(a);
          });
          col.appendChild(sr);
        }
        if (m.role === 'fly'){
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          actions.innerHTML = `
            <button data-act="copy">Copiar</button>
            <button data-act="download">Descargar</button>
            <button data-act="listen">Escuchar</button>
            <button data-act="regen">Regenerar</button>`;
          actions.querySelector('[data-act="copy"]').addEventListener('click', (e) => {
            navigator.clipboard.writeText(m.content);
            e.target.textContent = 'Copiado'; setTimeout(() => { e.target.textContent = 'Copiar'; }, 1400);
          });
          actions.querySelector('[data-act="download"]').addEventListener('click', () => downloadText(m.content, (conv.title || 'fly-respuesta') + '.md'));
          actions.querySelector('[data-act="listen"]').addEventListener('click', () => speakText(m.content));
          actions.querySelector('[data-act="regen"]').addEventListener('click', () => regenerate(conv, idx));
          col.appendChild(actions);
        } else if (m.role === 'user'){
          const actions = document.createElement('div');
          actions.className = 'msg-actions';
          actions.innerHTML = `<button data-act="edit">Editar</button>`;
          actions.querySelector('[data-act="edit"]').addEventListener('click', () => {
            input.value = m.content;
            input.dispatchEvent(new Event('input'));
            conv.messages.splice(idx); // quita este mensaje y todo lo que sigue
            persistConversations(); renderHistory(); renderThread();
            input.focus();
          });
          col.appendChild(actions);
        }
      }
      row.appendChild(avatar); row.appendChild(col);
      threadInner.appendChild(row);
    });
    thread.scrollTop = thread.scrollHeight;
  }

  function downloadText(text, filename){
    const blob = new Blob([text], { type:'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename.replace(/[^a-z0-9\-_. ]/gi,'_');
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- attachments ----------
  document.getElementById('attach-btn').addEventListener('click', () => fileInput.click());

  // ---------- voz: dictado (Web Speech API, nativo del navegador, gratis) ----------
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('mic-btn');
  let recognizer = null, isRecording = false;
  if (SpeechRecognitionCtor){
    recognizer = new SpeechRecognitionCtor();
    recognizer.lang = 'es-ES';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = (e) => {
      const text = e.results[0][0].transcript;
      input.value = (input.value ? input.value + ' ' : '') + text;
      input.dispatchEvent(new Event('input'));
    };
    recognizer.onend = () => { isRecording = false; micBtn.classList.remove('recording'); };
    recognizer.onerror = () => { isRecording = false; micBtn.classList.remove('recording'); };
  } else {
    micBtn.style.display = 'none';
  }
  micBtn.addEventListener('click', () => {
    if (!recognizer) return;
    if (isRecording){ recognizer.stop(); return; }
    isRecording = true; micBtn.classList.add('recording');
    recognizer.start();
  });

  // ---------- voz: lectura en voz alta (speechSynthesis, nativo del navegador, gratis) ----------
  function speakText(text){
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text.replace(/[*_`#]/g, ''));
    utter.lang = 'es-ES';
    window.speechSynthesis.speak(utter);
  }
  document.getElementById('image-mode-btn').addEventListener('click', () => {
    imageMode = !imageMode;
    document.getElementById('image-mode-btn').classList.toggle('active', imageMode);
    input.placeholder = imageMode ? 'Describe la imagen que quieres crear' : 'Escribe un mensaje a Fly';
    input.focus();
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    const isImage = /^image\/(png|jpe?g|webp|gif)$/.test(file.type);
    const isPdf = file.type === 'application/pdf';
    reader.onload = () => {
      if (isImage || isPdf){
        const base64 = reader.result.split(',')[1];
        pendingFile = { name:file.name, mediaType:file.type, data:base64, kind: isImage ? 'image' : 'pdf' };
      } else {
        pendingFile = { name:file.name, mediaType:'text/plain', data: String(reader.result).slice(0,15000), kind:'text' };
      }
      renderPendingAttachment();
    };
    if (isImage || isPdf) reader.readAsDataURL(file); else reader.readAsText(file);
    fileInput.value = '';
  });

  function renderPendingAttachment(){
    if (!pendingFile){ pendingAttachmentEl.style.display='none'; pendingAttachmentEl.innerHTML=''; return; }
    pendingAttachmentEl.style.display='block';
    pendingAttachmentEl.innerHTML = `
      <div class="attachment-chip" style="display:inline-flex;">
        ${pendingFile.kind === 'image' ? `<img src="data:${pendingFile.mediaType};base64,${pendingFile.data}">` : '<span>📎</span>'}
        <span>${pendingFile.name}</span>
        <button id="remove-attach" style="background:none;border:none;color:var(--muted);cursor:pointer;">&times;</button>
      </div>`;
    document.getElementById('remove-attach').addEventListener('click', () => { pendingFile = null; renderPendingAttachment(); });
  }

  // ---------- memory modal ----------
  const memoryModal = document.getElementById('memory-modal');
  const memorySwitch = document.getElementById('memory-switch');
  document.getElementById('memory-btn').addEventListener('click', () => { memoryModal.classList.add('open'); renderMemoryList(); });
  document.getElementById('memory-close').addEventListener('click', () => memoryModal.classList.remove('open'));
  memoryModal.addEventListener('click', (e) => { if (e.target === memoryModal) memoryModal.classList.remove('open'); });

  memorySwitch.addEventListener('click', async () => {
    memoryEnabled = !memoryEnabled;
    memorySwitch.classList.toggle('on', memoryEnabled);
    api('/settings', { method:'PUT', body: JSON.stringify({ memoryEnabled: memoryEnabled ? '1' : '0' }) }).catch(console.error);
  });

  document.getElementById('memory-add-btn').addEventListener('click', addMemoryNote);
  document.getElementById('memory-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') addMemoryNote(); });

  async function addMemoryNote(){
    const el = document.getElementById('memory-input');
    const val = el.value.trim();
    if (!val) return;
    el.value = '';
    try{
      const created = await api('/memory', { method:'POST', body: JSON.stringify({ note: val }) });
      memoryNotes.unshift(created);
    }catch(e){ memoryNotes.unshift({ id:'local'+Date.now(), note: val }); }
    renderMemoryList();
  }

  function renderMemoryList(){
    const list = document.getElementById('memory-list');
    if (memoryNotes.length === 0){ list.innerHTML = '<div id="memory-empty">Aún no hay recuerdos guardados.</div>'; return; }
    list.innerHTML = '';
    memoryNotes.forEach((item) => {
      const row = document.createElement('div');
      row.className = 'memory-item';
      row.innerHTML = `<span>${item.note.replace(/</g,'&lt;')}</span><button data-id="${item.id}">&times;</button>`;
      row.querySelector('button').addEventListener('click', () => {
        api(`/memory/${item.id}`, { method:'DELETE' }).catch(console.error);
        memoryNotes = memoryNotes.filter(m => m.id !== item.id);
        renderMemoryList();
      });
      list.appendChild(row);
    });
  }

  // ---------- sending ----------
  async function sendMessage(){
    const text = input.value.trim();
    if (!text && !pendingFile) return;
    if (!currentId) createConversation();
    const conv = getCurrent();

    if (imageMode && text){
      input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
      await generateImage(conv, text);
      return;
    }

    const userMsg = { role:'user', content: text || (pendingFile ? `Archivo adjunto: ${pendingFile.name}` : '') };
    if (pendingFile) userMsg.attachment = pendingFile;
    conv.messages.push(userMsg);
    if (!conv.title) conv.title = (text || pendingFile.name).slice(0,40);
    conv.updatedAt = Date.now();

    const attachment = pendingFile;
    pendingFile = null;
    renderPendingAttachment();
    input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
    persistConversations(); renderHistory(); renderThread();

    await runAssistantTurn(conv, attachment);
  }

  async function regenerate(conv, idx){
    conv.messages.splice(idx, 1); // quita la respuesta anterior
    renderThread();
    await runAssistantTurn(conv, null);
  }

  async function runAssistantTurn(conv, attachment){
    const mode = MODES.find(m => m.id === currentMode);
    const statusText = mode.tools ? 'Buscando en la web…' : (attachment && attachment.kind !== 'text' ? 'Analizando archivo…' : 'Pensando…');
    conv.messages.push({ role:'fly', content:'', pending:true, statusText });
    renderThread();

    try {
      const apiMessages = conv.messages
        .filter(m => !m.pending && !m.error)
        .map(m => {
          if (m.role === 'user' && m.attachment){
            const blocks = [];
            if (m.attachment.kind === 'image'){
              blocks.push({ type:'image', source:{ type:'base64', media_type:m.attachment.mediaType, data:m.attachment.data } });
              blocks.push({ type:'text', text: m.content });
            } else if (m.attachment.kind === 'pdf'){
              blocks.push({ type:'document', source:{ type:'base64', media_type:'application/pdf', data:m.attachment.data } });
              blocks.push({ type:'text', text: m.content });
            } else {
              blocks.push({ type:'text', text: `${m.content}\n\n--- contenido de ${m.attachment.name} ---\n${m.attachment.data}` });
            }
            return { role:'user', content: blocks };
          }
          return { role: m.role === 'fly' ? 'assistant' : 'user', content: m.content };
        });

      let systemPrompt = 'Eres Fly, un asistente de IA conversacional avanzado. Responde en el idioma que use la persona, de forma clara, directa y bien estructurada. Cuando el usuario pida algo extenso (documentos, código completo, planes detallados), desarróllalo con la extensión y profundidad necesarias, sin acortarlo artificialmente. ' + mode.system;
      if (memoryEnabled && memoryNotes.length){
        systemPrompt += '\n\nContexto que el usuario ha guardado sobre sí mismo o sus preferencias (esto es memoria acumulada de conversaciones anteriores, úsala para responder mejor):\n- ' + memoryNotes.map(m => m.note).join('\n- ');
      }

      const body = { system: systemPrompt, messages: apiMessages };
      if (mode.tools) body.tools = true;

      const result = await streamChat(body, (partial) => {
        const bubbleEl = document.getElementById('pending-bubble');
        if (bubbleEl) bubbleEl.innerHTML = formatContent(partial || '…');
        thread.scrollTop = thread.scrollHeight;
      });

      const replyText = result.text || 'No obtuve una respuesta. Intenta de nuevo.';
      const sources = result.sources || [];

      const pendingIdx = conv.messages.findIndex(m => m.pending);
      conv.messages[pendingIdx] = { role:'fly', content: replyText, sources, time: Date.now() };

      if (memoryEnabled){
        const lastUser = [...conv.messages].reverse().find(m => m.role === 'user');
        if (lastUser) learnFromExchange(lastUser.content, replyText);
      }
    } catch (err) {
      const pendingIdx = conv.messages.findIndex(m => m.pending);
      conv.messages[pendingIdx] = { role:'fly', content:'Ocurrió un error al conectar con Fly. Intenta de nuevo.', error:true };
      console.error('Fly API error:', err);
    }
    conv.updatedAt = Date.now();
    persistConversations();
    renderThread();
  }

  // ---------- generación de imágenes ----------
  async function generateImage(conv, promptText, opts = {}){
    const userMsg = { role:'user', content: promptText };
    if (!opts.isRegen) conv.messages.push(userMsg);
    if (!conv.title) conv.title = promptText.slice(0,40);
    persistConversations(); renderHistory(); renderThread();

    conv.messages.push({ role:'fly', content:'', pending:true, statusText: opts.upscale ? 'Generando en mayor calidad…' : 'Mejorando tu descripción y generando la imagen…' });
    renderThread();

    try {
      const body = { prompt: promptText };
      if (opts.width) body.width = opts.width;
      if (opts.height) body.height = opts.height;
      if (opts.seed) body.seed = opts.seed;

      const data = await api('/image', { method:'POST', body: JSON.stringify(body) });
      const pendingIdx = conv.messages.findIndex(m => m.pending);
      conv.messages[pendingIdx] = {
        role:'fly',
        content: data.enhancedPrompt || promptText,
        image: { data: data.image, mimeType: data.mimeType, seed: data.seed, width: data.width, height: data.height, originalPrompt: promptText },
      };
    } catch (err) {
      const pendingIdx = conv.messages.findIndex(m => m.pending);
      conv.messages[pendingIdx] = { role:'fly', content:'No se pudo generar la imagen. Intenta de nuevo en unos segundos.', error:true };
      console.error('Fly image error:', err);
    }
    conv.updatedAt = Date.now();
    persistConversations();
    renderThread();
  }

  function downloadImage(base64, mimeType, filename){
    const a = document.createElement('a');
    a.href = `data:${mimeType};base64,${base64}`;
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  // Aprendizaje automático: tras cada intercambio, Fly revisa si hay algo
  // duradero que valga la pena recordar (preferencias, datos del proyecto, etc.)
  // y lo guarda solo sin interrumpir la conversación.
  async function learnFromExchange(userText, replyText){
    try{
      const extractPrompt = `Del siguiente intercambio, extrae como máximo una nota corta (una frase) sólo si contiene un dato DURADERO y útil para el futuro sobre el usuario o su proyecto (preferencia, objetivo, dato personal relevante, decisión tomada). Si no hay nada digno de recordar, responde exactamente con "NADA". No inventes información.\n\nUsuario: ${userText}\nFly: ${replyText.slice(0,800)}`;
      const data = await api('/chat', { method:'POST', body: JSON.stringify({ messages: [{ role:'user', content: extractPrompt }], maxOutputTokens: 60 }) });
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const note = textBlocks.join(' ').trim();
      if (!note || /^nada$/i.test(note)) return;
      const exists = memoryNotes.some(m => m.note.toLowerCase() === note.toLowerCase());
      if (exists) return;
      const created = await api('/memory', { method:'POST', body: JSON.stringify({ note }) });
      memoryNotes.unshift(created);
    }catch(e){ /* aprendizaje automático es best-effort, no debe romper el chat */ }
  }

  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim().length === 0 && !pendingFile;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (!sendBtn.disabled) sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);
  document.getElementById('new-chat-btn').addEventListener('click', createConversation);
  document.getElementById('toggle-sidebar').addEventListener('click', () => {
    sidebar.classList.toggle('collapsed'); sidebar.classList.toggle('open');
  });

  // ---------- init ----------
  async function init(){
    let settings = {};
    try{ settings = await api('/settings'); }catch(e){ /* backend no disponible aún */ }
    applyTheme(settings.theme || 'dark');
    memoryEnabled = settings.memoryEnabled !== '0';
    memorySwitch.classList.toggle('on', memoryEnabled);

    try{ memoryNotes = await api('/memory'); }catch(e){ memoryNotes = []; }
    try{
      const convs = await api('/conversations');
      conversations = convs.map(c => ({ ...c, updatedAt: c.updated_at }));
    }catch(e){ conversations = []; }

    renderModeRow();
    if (conversations.length){ currentId = conversations[0].id; renderHistory(); renderThread(); }
    else { await createConversation(); }
  }
  init();
})();
</script>
</body>
</html>
